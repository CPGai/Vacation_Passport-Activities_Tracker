<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Passport booklet body -->
  <g filter="url(#shadow)">
    <!-- Back pages edge preview -->
    <rect x="14" y="6" width="42" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Main Passport Cover -->
    <rect x="10" y="6" width="44" height="52" rx="4" fill="url(#coverGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Spine binding line -->
    <path d="M16 6 L16 58" stroke="url(#spineGrad)" stroke-width="2.5"/>
    <path d="M17.5 6 L17.5 58" stroke="#fef08a" stroke-width="0.75" stroke-opacity="0.6"/>
  </g>

  <!-- Gold Emblem Circle -->
  <circle cx="34" cy="30" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="34" cy="30" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 1.5"/>

  <!-- World Globe inside emblem -->
  <!-- Globe outline -->
  <circle cx="34" cy="30" r="9.5" fill="#1e293b" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="1.2"/>
  
  <!-- Latitude lines -->
  <ellipse cx="34" cy="30" rx="9.5" ry="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <line x1="24.5" y1="30" x2="43.5" y2="30" stroke="url(#goldGrad)" stroke-width="0.8"/>
  
  <!-- Longitude lines -->
  <ellipse cx="34" cy="30" rx="4.5" ry="9.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <line x1="34" y1="20.5" x2="34" y2="39.5" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Small Star Top -->
  <path d="M34 11.5 L34.8 13.5 L37 13.8 L35.4 15.2 L35.8 17.3 L34 16.2 L32.2 17.3 L32.6 15.2 L31 13.8 L33.2 13.5 Z" fill="url(#goldGrad)"/>

  <!-- Airplane Silhouette flying across top-right -->
  <g transform="translate(36, 17) rotate(25) scale(0.65)">
    <path d="M12 2 L14 8 L22 10 L22 12 L14 12 L13 18 L16 20 L16 22 L11 21 L6 22 L6 20 L9 18 L8 12 L0 12 L0 10 L8 8 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden Text Bars (PASSPORT & BIOMETRIC SYMBOL) -->
  <rect x="22" y="46" width="24" height="2" rx="1" fill="url(#goldGrad)"/>
  <rect x="26" y="50" width="16" height="1.5" rx="0.75" fill="url(#goldGrad)" fill-opacity="0.85"/>
  
  <!-- Biometric Chip Symbol -->
  <g transform="translate(30, 52.5)">
    <rect x="0" y="0" width="8" height="3" rx="0.6" fill="none" stroke="url(#goldGrad)" stroke-width="0.6"/>
    <circle cx="4" cy="1.5" r="0.8" fill="url(#goldGrad)"/>
    <line x1="0" y1="1.5" x2="2.5" y2="1.5" stroke="url(#goldGrad)" stroke-width="0.6"/>
    <line x1="5.5" y1="1.5" x2="8" y2="1.5" stroke="url(#goldGrad)" stroke-width="0.6"/>
  </g>
</svg>
