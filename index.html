<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasaporte infantil de Andrés</title><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>Pasaporte de Andrés</h1><p class="hint">Editor local e imprimible</p></div><button id="printBtn">Imprimir pasaporte</button><button id="coverBtn">Imprimir portada</button></header><main><aside><details open><summary>⚙ Opciones</summary><section><h3>Documento</h3><label>Páginas lógicas <input id="pageCount" type="number" min="2" step="2"></label><button id="newDoc">Aplicar páginas</button><label class="check"><input id="showNumbers" type="checkbox"> Mostrar e imprimir números</label></section><section><h3>Plantillas y apariencia</h3><label>Página <select id="pageSelect"></select></label><label>Plantilla <select id="template"><option value="activity">Actividad</option><option value="identity">Información</option><option value="blank">En blanco</option><option value="cover">Portada</option></select></label><label>Color del marco <input id="frameColor" type="color"></label></section><section><h3>Actividad seleccionada</h3><label>Actividad <input id="title"></label><label>Descripción <textarea id="description"></textarea></label><label>Sello <input id="stamp"></label><button id="savePage">Guardar página</button></section><section><h3>Reorganizar actividades</h3><label>Intercambiar <select id="from"></select> con <select id="to"></select></label><button id="swap">Intercambiar</button><div id="order" class="hint"></div></section><section><h3>Imágenes y fondos</h3><label>Carpeta de fondos <input id="folder" type="file" webkitdirectory multiple></label><label>Imagen de página <input id="image" type="file" accept="image/*"></label><label>Opacidad <input id="opacity" type="range" min="0" max="100"><output id="opacityOut"></output></label><p id="match" class="hint"></p></section><section><button id="save">Guardar cambios</button><button id="restore">Restaurar guardado</button><button id="reset">Restaurar original</button></section></details><div class="print-help">Letter · vertical · escala 100% · doble cara · voltear por el borde largo</div></aside><div class="content"><nav><button class="tab active" data-tab="logical">Vista lógica</button><button class="tab" data-tab="print">Vista de imposición</button></nav><div id="logical" class="view"></div><div id="print" class="view hidden"></div></div></main><script src="passport-core-browser.js"></script><script src="app.js"></script></body></html>
